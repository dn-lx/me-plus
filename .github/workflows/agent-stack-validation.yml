name: Agent stack validation

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-stack-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: policy / agent-stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test bootstrap automation
        run: node --test tests/bootstrap-project.test.mjs
      - name: Test bootstrap end to end
        run: node --test tests/bootstrap-project-e2e.test.mjs
      - name: Test local agent router
        run: node --test tests/local-agent-router.test.mjs
      - name: Validate documentation consistency
        run: node scripts/validate-docs.mjs
      - name: Validate canonical agent stack
        run: node scripts/validate-agent-stack.mjs
