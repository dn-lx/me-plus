name: Health seven-day compaction contracts
on:
  pull_request:
    branches: [dev]
    paths: ['supabase/migrations/*health*', 'tests/sql/health-*', '.github/workflows/health-compaction-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-contract:
    name: health / seven-day compaction
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: health_compact_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_ci_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: health_compact_test
      PGUSER: postgres
      PGPASSWORD: disposable_ci_fixture
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prove quality, correction, replay and late-revision retention contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = health_compact_test
          for file in tests/sql/health-sync-fixture.sql supabase/migrations/20260928122843_health_bulk_upsert_keys.sql supabase/migrations/20260929144000_health_raw_event_revision_history.sql supabase/migrations/20260929230221_health_atomic_ingest_v4.sql tests/sql/health-sync-live-guards.sql tests/sql/health-sync-install-guards.sql supabase/migrations/20261017145227_health_batch_unique_run_key.sql tests/sql/health-unit-fixture.sql supabase/migrations/20261018101405_health_connect_unit_compatibility.sql supabase/migrations/20261018103853_health_unit_numeric_roundtrip.sql tests/sql/health-unit-contract.sql tests/sql/health-compaction-fixture.sql supabase/migrations/20261018103839_health_seven_day_compaction.sql tests/sql/health-compaction-contract.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: Reproduce reference snapshot race then verify locked recheck twice
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/sql/health-compaction-reference-race.py --expect-unsafe
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261018111313_health_compaction_locked_reference_recheck.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261018111313_health_compaction_locked_reference_recheck.sql
          python3 tests/sql/health-compaction-reference-race.py
