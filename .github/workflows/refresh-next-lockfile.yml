name: Refresh Me+ Next Lockfile
on:
  push:
    branches:
      - feat/meplus-2-execution-hardening-20261015
    paths:
      - apps/web/package.json
      - .github/workflows/refresh-next-lockfile.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate pinned dependency lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: meplus-next-patched-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): resolve patched Next.js 16.3.8"
          git push origin "HEAD:feat/meplus-2-execution-hardening-20261015"
